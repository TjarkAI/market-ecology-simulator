[pytest]
# Without this, plain `pytest` fails to collect every test module with
# "ModuleNotFoundError: No module named 'mes'" — eleven import errors and not one
# test run. It worked only via `python -m pytest`, which puts the working directory
# on sys.path as a side effect. A test suite that needs to be invoked a particular
# undocumented way is a test suite people stop running.
pythonpath = .
testpaths = tests
# `-q` because 300 dots say as much as 300 lines and the failures are what matter.
addopts = -q
